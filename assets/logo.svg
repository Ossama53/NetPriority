<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NetPriority logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1840"/>
      <stop offset="1" stop-color="#0c1022"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2c0"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffd8"/>
      <stop offset="1" stop-color="#2de2c0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a86ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- faint dashed outer orbit -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#6c6ba8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9"/>

  <!-- main ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- blocked apps: dim dots on the orbit -->
  <g fill="#4b4a73">
    <circle cx="122" cy="122" r="9"/>
    <circle cx="66" cy="256" r="9"/>
    <circle cx="122" cy="390" r="9"/>
    <circle cx="390" cy="390" r="9"/>
    <circle cx="446" cy="256" r="9"/>
  </g>
  <!-- priority app: bright dot -->
  <circle cx="390" cy="122" r="16" fill="#ffb703"/>
  <circle cx="390" cy="122" r="26" fill="none" stroke="#ffb703" stroke-opacity="0.4" stroke-width="3"/>

  <!-- signal arcs -->
  <g fill="none" stroke="url(#wifi)" stroke-width="22" stroke-linecap="round">
    <path d="M213.6 287.6 A60 60 0 0 1 298.4 287.6"/>
    <path d="M178.2 252.2 A110 110 0 0 1 333.8 252.2"/>
    <path d="M142.9 216.9 A160 160 0 0 1 369.1 216.9"/>
  </g>
  <circle cx="256" cy="330" r="20" fill="#7dffd8"/>
</svg>
